<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GoTrampo — Plano de ação</title>
<style>
  :root { --blue:#1565C0; --blue-dark:#0D47A1; --blue-soft:#E3EEFB; --green:#1e7e34; --green-soft:#e6f4ea;
          --grey:#667085; --line:#e6eaf0; --bg:#f3f6fb; --card:#fff; --text:#1d2433; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI", Roboto, Arial, sans-serif; color:var(--text); background:var(--bg); font-size:15px; }
  header { background:linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%); color:#fff; padding:22px 16px 46px; }
  .wrap { max-width:820px; margin:0 auto; }
  .back { color:#cfe0f7; font-size:13px; text-decoration:none; }
  .back:hover { color:#fff; }
  h1 { font-size:21px; margin:10px 0 2px; }
  header p { margin:0; font-size:13px; opacity:.85; }
  .prog { margin-top:16px; background:rgba(255,255,255,.22); border-radius:20px; height:10px; overflow:hidden; }
  .prog > div { height:100%; background:#fff; width:0; transition:width .25s; }
  .progtxt { font-size:12px; margin-top:6px; opacity:.9; }
  main { margin-top:-24px; padding:0 16px 50px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 2px 10px rgba(16,24,40,.06); margin-bottom:14px; overflow:hidden; }
  section > header { background:none; color:var(--text); padding:14px 18px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); cursor:pointer; }
  section > header h2 { font-size:16px; margin:0; flex:1; }
  .badge { font-size:11px; font-weight:700; background:var(--blue-soft); color:var(--blue-dark); padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .badge.done { background:var(--green-soft); color:var(--green); }
  .body { padding:6px 18px 14px; }
  h3 { font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--grey); margin:14px 0 4px; }
  label.t { display:flex; gap:10px; align-items:flex-start; padding:7px 0; cursor:pointer; line-height:1.4; }
  label.t input { width:18px; height:18px; margin-top:1px; flex:none; accent-color:var(--green); }
  label.t.sub { margin-left:28px; }
  label.t.sub2 { margin-left:56px; }
  label.t input:checked + span { color:#98a2b3; text-decoration:line-through; }
  .note { font-size:12.5px; color:var(--grey); background:#f7f9fc; border-radius:8px; padding:9px 12px; margin:8px 0 2px; line-height:1.5; }
  .reset { display:block; margin:6px auto 0; background:none; border:none; color:var(--grey); font-size:12px; text-decoration:underline; cursor:pointer; }
  .hidden { display:none; }
  footer { text-align:center; font-size:11px; color:#98a2b3; padding:0 16px 30px; line-height:1.6; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="back" href="../">← Central GoTrampo</a>
    <h1>Plano de ação — reunião de 13/11</h1>
    <p>Marque o que for sendo concluído. O progresso fica salvo neste navegador.</p>
    <div class="prog"><div id="barra"></div></div>
    <div class="progtxt" id="progtxt"></div>
  </div>
</header>

<main>
  <div class="wrap" id="app"></div>
  <button class="reset" id="reset">Limpar todas as marcações</button>
</main>

<footer>Os itens ficam salvos só neste navegador/dispositivo. Para dividir tarefas com a equipe, o próximo passo é mover isto para uma planilha compartilhada.</footer>

<script>
  /* Cada item: [texto, nível 0|1|2] ; títulos de grupo: ["#", texto] */
  var PLANO = [
    { id:"kpi", titulo:"1. Definição de KPIs", nota:"Marketing (aquisição) e Produto. Depois de definidos, vão para a planilha de acompanhamento mensal.", itens:[
      ["#","Marketing — Aquisição"],
      ["Instagram",0], ["Seguidores",1], ["Alcance",1],
      ["Acessos ao site",0],
      ["Oportunidades",0], ["Inbound",1], ["Outbound",1],
      ["Novos clientes",0], ["Por plano",1],
      ["Clientes",0], ["Plano",1], ["Valor",1],
      ["#","Produto"],
      ["Profissionais cadastrados",0],
      ["Profissionais ativos (ao menos um acesso no mês)",0],
      ["Oportunidades (vagas) criadas",0],
      ["Empresas com perfil ativo",0],
      ["Empresas com oportunidades ativas no mês",0],
      ["Número de profissionais com acesso no mês",0]
    ]},
    { id:"solucoes", titulo:"2. Definição de planos e valores", nota:"Os planos passam a ser apresentados como Soluções.", itens:[
      ["#","Soluções"],
      ["Consultorias e Recrutadores",0],
      ["Pequenas e Médias Empresas",0],
      ["Grandes Empresas",0],
      ["Definir valores de cada solução",0]
    ]},
    { id:"site", titulo:"3. Reformular o site", itens:[
      ["Trocar “Planos” por “Soluções”",0],
      ["Reformular a página de Soluções",0],
      ["Retirar textos e CTA sobre Teste Grátis",0]
    ]},
    { id:"anuncios", titulo:"4. Anúncios: Facebook e Instagram", itens:[
      ["Configurar a conta de anúncios",0],
      ["#","Configurar públicos"],
      ["Público: Empresas",0], ["Público: Profissionais",0],
      ["#","Criar campanhas de anúncios"],
      ["Campanha: Empresas",0], ["Campanha: Profissionais",0]
    ]},
    { id:"conteudo", titulo:"5. Calendário de conteúdo — Instagram", itens:[
      ["Criar o calendário de conteúdo",0],
      ["1 card por semana com dicas para profissionais",1],
      ["1 card por semana com dicas para empresas sobre pessoas e gestão",1],
      ["1 vídeo por semana, alternando dicas para profissionais e para empresas",1]
    ]}
  ];

  var CHAVE = "gotrampo-plano-1311";
  var estado = {};
  try { estado = JSON.parse(localStorage.getItem(CHAVE) || "{}"); } catch (e) { estado = {}; }
  function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) {} }

  var app = document.getElementById("app");
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  PLANO.forEach(function (sec) {
    var h = '<section data-sec="' + sec.id + '"><header><h2>' + esc(sec.titulo) + '</h2><span class="badge"></span></header><div class="body">';
    if (sec.nota) h += '<div class="note">' + esc(sec.nota) + '</div>';
    sec.itens.forEach(function (it, i) {
      if (it[0] === "#") { h += '<h3>' + esc(it[1]) + '</h3>'; return; }
      var key = sec.id + "-" + i;
      var cls = it[1] === 1 ? " sub" : (it[1] === 2 ? " sub2" : "");
      h += '<label class="t' + cls + '"><input type="checkbox" data-k="' + key + '" data-s="' + sec.id + '"><span>' + esc(it[0]) + '</span></label>';
    });
    app.insertAdjacentHTML("beforeend", h + '</div></section>');
  });

  function atualizar() {
    var total = 0, feitos = 0;
    document.querySelectorAll("section").forEach(function (sec) {
      var cbs = sec.querySelectorAll("input[type=checkbox]"), f = 0;
      cbs.forEach(function (c) { if (c.checked) f++; });
      var b = sec.querySelector(".badge");
      b.textContent = f + " de " + cbs.length;
      b.classList.toggle("done", f === cbs.length && cbs.length > 0);
      total += cbs.length; feitos += f;
    });
    var pct = total ? Math.round(feitos * 100 / total) : 0;
    document.getElementById("barra").style.width = pct + "%";
    document.getElementById("progtxt").textContent = feitos + " de " + total + " itens concluídos (" + pct + "%)";
  }

  document.querySelectorAll("input[type=checkbox]").forEach(function (c) {
    c.checked = !!estado[c.dataset.k];
    c.addEventListener("change", function () {
      if (c.checked) estado[c.dataset.k] = 1; else delete estado[c.dataset.k];
      salvar(); atualizar();
    });
  });
  document.querySelectorAll("section > header").forEach(function (h) {
    h.addEventListener("click", function () { h.nextElementSibling.classList.toggle("hidden"); });
  });
  document.getElementById("reset").addEventListener("click", function () {
    estado = {}; salvar();
    document.querySelectorAll("input[type=checkbox]").forEach(function (c) { c.checked = false; });
    atualizar();
  });
  atualizar();
</script>
</body>
</html>
